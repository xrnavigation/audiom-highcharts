name: build

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - 'release/**'
  workflow_dispatch:

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Run tests.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Run tests via shared composite action
        uses: StudioWhyNot/act/common/npm/npm-test@master
        with:
          workingDirectory: .
          nodeVersion: ${{ env.NODE_VERSION }}
          # CI script wraps vitest with --reporter=json --outputFile so the
          # composite action can upload it as an artifact.
          testCommand: npm run test:ci
          uploadTestResults: true
          testResultsFile: plugin/test-results.json
          uploadCoverage: true
          # NB: input is `registries` (plural, newline-separated), not
          # `registry` — the action silently ignores unknown inputs and
          # then falls back to its default Gitea-style URL, which 401s on
          # real github.com. Pin to the actual GitHub Packages npm host.
          #
          # Auth note: GITHUB_TOKEN routinely 401s against npm.pkg.github.com
          # for cross-repo @org/* packages even when the package's "Manage
          # Actions access" grants this repo read — the npm-legacy code
          # path requires a token bound to a real user account, and the
          # ephemeral GITHUB_TOKEN bot identity doesn't qualify.
          # Workaround: a classic PAT with `read:packages` scope, stored
          # as the NPM_TOKEN secret. Falls back to GITHUB_TOKEN
          # so first-party PRs still attempt to run before the secret is
          # provisioned (they'll fail at install but with a clearer error).
          registries: https://npm.pkg.github.com
          apiKeys: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
          coverageDirectory: plugin/coverage
